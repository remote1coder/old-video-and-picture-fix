# ============================================
# 老影像修复 - 视频修复套件配置文件
# 参数优先级：CLI > user_overrides > recommended_params > audio_override > paths > global+audio+ai > defaults
# FIX-P5-1: Corrected priority order per v7.32 §3.2
# ============================================

global:
  output_dir: "./output"
  temp_dir: "./temp"
  # FIX-2026-10-20: 原名 `encoder: "svtav1"` —— stage7 实际读的是
  # `video_encoder`，且 "svtav1" 不是 ffmpeg 的编码器名（应为 libsvtav1），
  # 所以这一项此前从未生效（生效的一直是代码默认值，巧合结果相同）。
  # 现两个键都认，并做了简写归一；推荐用下面的标准写法。
  video_encoder: "libsvtav1"   # 可选 libx265（= x265，CRF 18 + preset slow）
  crf: 24
  preset: 4
  preset_max_quality: true
  pix_fmt: "yuv420p10le"
  color_range: "limited"
  # FIX-2026-10-20（第六轮 §2.5 待办）：色彩保真校验门。
  # stage7 在发布前比对「原始输入 vs 本次编码成品」的 RGB 三通道均值，
  # 最大绝对差超过阈值即记录。默认只 WARNING —— 阈值需要先在一批真实
  # 素材上标定（不同内容天然有差异），且开启 AI 超分时 GAN 模型本身就
  # 会带来可测色偏（第六轮实测 R/B 比从 1.007 漂到 0.955）。
  # 阈值 60.0 的标定依据（shared_modules/color_probe.py 的 docstring）：
  #   纯黑成品 delta≈116 → 拦；ProPhoto→sRGB delta≈26.7 → 放行；
  #   普通 sRGB 正常处理 delta≈1 → 放行。
  # 即它专门抓"整体崩坏"（黑/白/内容丢失），**不抓细微色偏**。
  # 要抓细微色偏需针对素材标定更严的值，设严了会频繁误报、反而没人看日志。
  color_drift_threshold: 60.0   # 0-255 的 RGB 通道均值最大绝对差
  color_drift_enforce: false    # true 时超阈值丢弃暂存并返回 86（不覆盖既有成品）
  # FIX-2026-10-21（方案 B + E）：**无进展看门狗**。
  #
  # stage 子进程连续这么多秒 temp 目录一个字节都没长，判为卡死并杀进程
  # （rc=87，日志 STAGE_STALLED）。这是"有证据"的判定：
  #   * 与画面复杂度无关 —— 复杂画面只是写得慢，不会停止增长；
  #   * 与机器性能无关 —— 慢机器只要还在推进就不会被杀；
  #   * 与分辨率无关 —— 不需要任何耗时估算。
  #
  # 为什么需要它：16 分钟 1080p 纯传统链的 stage7 编码实测要 3 小时，而
  # "AI 要跑多久"根本没法靠 duration×系数 猜准（1080p×28840 帧的推理量级
  # 远超旧公式的 4 小时上限）。旧机制是"预测时长然后判死"，必然两头不讨好：
  # 慢的要杀、死的要等。现在职责分清了 ——
  #   看门狗负责"卡死"（有证据），48 小时 timeout 只作最终保险。
  #
  # 设为 0 或负数关闭看门狗（只留 48 小时保险）。
  stage_inactivity_timeout: 600
  platform: "auto"
  gpu_priority: ["cuda", "rocm", "mps", "cpu"]
  # 防抖默认 auto：抽样测全局位移后决定（见 stage1.detect_shakiness）
  # 想要旧行为（总是开）：改成 "DepanStabilize"；想总是关：改成 ""
  stabilize: "auto"
  shake_probe_samples: 12
  shake_probe_frames: 40
  shake_probe_threshold_px: 1.0
  log_level: "INFO"
  log_dir: "./logs"
  manifest_format: "yaml"
  log_max_lines: 10000
  log_backup_count: 5
  log_max_line_bytes: 1048576
  vs_bit_depth: 16
  cleanup_intermediates: true
  retry_count: 2
  no_wsl_redirect: false
  svt_tile_rows: 2
  svt_tile_cols: 2

paths:
  analog_tape:
    ivtc: "VIVTC"
    ivtc_alt: "sRestore"
    ivtc_auto_fallback: true
    # FIX-P2-5: VFM mode and VDecimate cycle per v7.32 §3.10.13
    vfm_mode: 1
    vdecimate_cycle: 5
    ivtc_fallback_threshold:
      tff_bff_percent: 10
      progressive_percent: 90
    deinterlace: "QTGMC"
    denoise: "TemporalDegrain"          # havsfunc VS 函数名（无"2"，r33 真实参数 sigma/blockWidth）
    denoise_params:
      sigma: 16
      blockWidth: 16
    target_resolution: "720x480"
    target_fps: "auto"
    chroma_shift: true
    crf: 24
    qtgmc_preset: "Slow"
    qtgmc_ezdenoise: 2
    qtgmc_sharpness: 0.5
    qtgmc_chromamotion: true
    qtgmc_sourcematch: 3
    qtgmc_input_type: 0
    qtgmc_fps_divisor: 2    # FIX-P5-2: Changed from 1 to 2 per v7.32 §3.2 / CLAUDE.md §5
    qtgmc_input_type_rule: "field_order"
    qtgmc_tff_required: true
    qtgmc_clear_fieldbased: true
    psf_use_input_type1: false
    # 防抖：auto = 抽样测位移后自动决定（推荐）
    #   "auto"（默认） 抽样 12 段×40 帧测位移；稳定素材跳过 Stab
    #   "DepanStabilize" / "Stab"  强制启用
    #   "" / "none" / "off"       强制关闭
    # Stab 在 1080p 上约 3.1 秒/帧，是 stage1 最贵的滤镜（占 ~89%）；
    # 稳定素材（位移 < 1px）启用它只有代价没有收益。
    stabilize: "auto"
    stabilize_params:
      dxmax: 10
      dymax: 10
    # auto 判定的抽样规模与阈值（仅 stabilize=auto 时生效）
    shake_probe_samples: 12        # 抽几段
    shake_probe_frames: 40         # 每段多少帧
    shake_probe_threshold_px: 1.0  # 平均位移低于此值 → 判为稳定，跳过 Stab

  dv_digital:
    ivtc: "auto"
    # FIX-P2-5: VFM mode and VDecimate cycle per v7.32 §3.10.13
    vfm_mode: 1
    vdecimate_cycle: 5
    deinterlace: "QTGMC"
    psf_handling: "SeparateFields_Weave"
    psf_handling_alt: "SeparateFields_DoubleWeave_SelectEvery"
    deblock: "Deblock_QED"
    deblock_alt: "ffmpeg_deblock"
    target_resolution: "720x480"
    target_fps: "auto"
    crf: 24
    qtgmc_preset: "Slower"
    qtgmc_ezdenoise: 1
    qtgmc_sharpness: 0.3
    qtgmc_chromamotion: true
    qtgmc_sourcematch: 3
    qtgmc_input_type: 0
    qtgmc_fps_divisor: 2    # FIX-P5-2: Changed from 1 to 2 per v7.32 §3.2 / CLAUDE.md §5
    qtgmc_input_type_rule: "field_order"
    qtgmc_tff_required: true
    qtgmc_clear_fieldbased: true

  hdv_avchd:
    ivtc: "auto"
    # FIX-P2-5: VFM mode and VDecimate cycle per v7.32 §3.10.13
    vfm_mode: 1
    vdecimate_cycle: 5
    deinterlace: "QTGMC"
    psf_handling: "SeparateFields_Weave"
    psf_handling_alt: "SeparateFields_DoubleWeave_SelectEvery"
    deblock: "DeblockPP7"
    target_resolution: "1920x1080"
    crf: 26
    qtgmc_preset: "Slower"
    qtgmc_ezdenoise: 1
    qtgmc_sharpness: 0.3
    qtgmc_chromamotion: true
    qtgmc_sourcematch: 3
    qtgmc_input_type: 0
    qtgmc_fps_divisor: 2    # FIX-P5-2: Changed from 1 to 2 per v7.32 §3.2 / CLAUDE.md §5
    qtgmc_input_type_rule: "field_order"
    qtgmc_tff_required: true
    qtgmc_clear_fieldbased: true

audio_override:
  # v7.3：各素材类型可独立覆盖全局音频参数
  # 优先级：命令行 > user_overrides > recommended_params > audio_override > paths > global.audio > 内置默认值
  # FIX-W注释: ORIGINAL omitted recommended_params and paths layers and merged
  # audio_override with paths, misrepresenting the v7.32 §3.2 6-layer cascade.
  analog_tape:
    hum_freq: null  # null=自动检测；显式 50/60 覆盖（对齐 v7.32 §3.2）
    hum_harmonics: 3
    hum_bandwidth: 2
    hum_width_type: "h"
    hum_dual: false
    hum_dual_ratio_threshold: 3.0
    hum_lowfreq_energy_threshold: 0.3
    hum_fft_window: "adaptive"
    hum_fft_overlap: 0.5
    hum_fft_window_func: "hann"
    denoise: "afftdn"
  dv_digital:
    hum_freq: null  # null=自动检测；显式 50/60 覆盖（对齐 v7.32 §3.2）
    hum_harmonics: 3
    hum_bandwidth: 2
    hum_width_type: "h"
    hum_dual: false
    hum_dual_ratio_threshold: 3.0
    hum_lowfreq_energy_threshold: 0.3
    hum_fft_window: "adaptive"
    hum_fft_overlap: 0.5
    hum_fft_window_func: "hann"
    denoise: "afftdn"
  hdv_avchd:
    hum_freq: null  # null=自动检测；显式 50/60 覆盖（对齐 v7.32 §3.2）
    hum_harmonics: 3
    hum_bandwidth: 2
    hum_width_type: "h"
    hum_dual: false
    hum_dual_ratio_threshold: 3.0
    hum_lowfreq_energy_threshold: 0.3
    hum_fft_window: "adaptive"
    hum_fft_overlap: 0.5
    hum_fft_window_func: "hann"
    denoise: "afftdn"

grain_factory3:
  enabled: true
  analog_tape:
    g1str: 1.0
    g2str: 0.2
    g3str: 0.2
    temp_avg: 0  # V-P-012 fix: temporal averaging for grain continuity
  dv_digital:
    g1str: 1.0
    g2str: 0.2
    g3str: 0.2
    temp_avg: 0
  hdv_avchd:
    g1str: 0.8
    g2str: 0.2
    g3str: 0.2
    temp_avg: 0
  addgrainc_enabled: false
  addgrainc_ratio: 0.2

ai:
  enabled: false
  face_restore: "GFPGAN"
  upscale_model: "realesr-general-x4v3"
  upscale_scale: 2
  model_dir: ""  # Empty = auto-detect PROJECT_ROOT/models; set explicit path if needed
  max_scale: 4
  lanczos_target: "auto"
  grain_strength: 0.3
  force_traditional_first: true
  force_allow_banned_upscale: false
  gpu_memory_fallback: true
  face_detect_fallback: ["RetinaFace", "YOLOv8-face", "MTCNN"]
  face_detect_threshold: 0.8
  face_detect_threshold_lowres: 0.6
  face_detect_lowres_max_dimension: 720
  static_segment_duration: 2.0  # V-P-013 fix: minimum static segment duration in seconds
  ban_original_input_pixels: true
  ban_intermediate_pixels: true

audio:
  enabled: true
  extract_first: true
  process_before_mux: true
  denoise: "afftdn"
  hum_filter: "bandreject_multi"
  # FIX-P7-1: null = auto-detect; 50 or 60 = user forced override per v6.32 §7.12
  hum_freq: null
  hum_harmonics: 3
  hum_bandwidth: 2
  hum_width_type: "h"
  hum_auto_detect_seconds: 30
  hum_energy_threshold: 0.005
  hum_dual: false
  hum_dual_ratio_threshold: 3.0
  hum_lowfreq_energy_threshold: 0.3
  hum_fft_window: "adaptive"
  hum_fft_overlap: 0.5
  hum_fft_window_func: "hann"
  codec: "aac"
  bitrate: "320k"
  sample_rate: "auto"
  ffmpeg_min_version: "4.4"
  fallback_denoise: "arnndn"
  arnndn_model_url: "https://github.com/richardpl/arnndn-models"
  arnndn_model: "std.rnnn"          # Xiph RNNoise 原版通用模型（.rnnn，非 .pb）
  multichannel_preserve: true
  compand_syntax_note: "subprocess_list_mode_points_pipe_or_space_separated"
