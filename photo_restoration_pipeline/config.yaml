# ============================================
# 老影像修复 - 照片修复套件配置文件
# 参数优先级：命令行 > user_overrides > paths > global > 内置默认值
# ============================================

global:
  output_dir: "./output"
  temp_dir: "./temp"
  # FIX-2026-10-20: 这一项是**记录性**字段，代码不读它。照片链的编码参数
  # 全部来自 photo.avif_params / photo.avif_rgb444_params（位深/YUV/range/
  # CICP/speed），由 shared_modules/media_io.build_avifenc_cmd() 组装。
  # 下面的 crf/preset 同理对照片 AVIF 无效（那是视频概念）。
  encoder: "avifenc"   # 仅供参考，非配置项
  crf: 24
  preset: 4
  # FIX-P10-9: Removed pix_fmt and color_range (video-only concepts)
  # Photo AVIF params are in photo.avif_params section below
  platform: "auto"
  gpu_priority: ["cuda", "rocm", "mps", "cpu"]
  log_level: "INFO"
  log_dir: "./logs"
  manifest_format: "yaml"
  log_max_lines: 10000
  log_backup_count: 5
  log_max_line_bytes: 1048576
  cleanup_intermediates: true
  retry_count: 2
  # FIX-P10-14: no_wsl_redirect is CLI-only per v7.32 §3.10.10
  # Kept here as default value; CLI --no-wsl-redirect overrides this
  no_wsl_redirect: false
  # FIX-P10-14: workers is CLI-only per v7.32 §3.3
  # Kept here as default value; CLI --workers overrides this
  workers: 1

paths:
  # Path-specific parameters for photo categories
  scan_print:
    scratch_remove: true
    scratch_remove_strength: 20
    deblock_strength: 25
    deband_threshold: 1.2
    grain_synthesis: true
  digital_photo:
    scratch_remove: false
    scratch_remove_strength: 0
    deblock_strength: 15
    deband_threshold: 0.8
    grain_synthesis: false

photo:
  max_long_edge: 3840
  max_short_edge: 2160
  dpi_threshold: 1200
  # FIX-P11-10: Per v6.32 §4.2.1: explicit input color space override
  # auto = detect from ICC profile; sRGB/AdobeRGB/ProPhoto = user-specified
  input_color_space: "auto"
  channel_degradation_std_threshold: 0.15
  channel_degradation_mean_threshold: 0.08
  channel_degradation_mean_threshold_severe: 0.15
  channel_degradation_std_threshold_severe: 0.25
  channel_correction_linear_space: true
  channel_correction_formula: "iec61966-2-1"
  channel_correction_normalize: true
  channel_correction_round: true
  channel_correction_clamp: true
  channel_correction_soft_compress: true
  channel_correction_float_precision: "float32"
  photo_bit_depth: 16
  # FIX-2026-10-20（G6 实跑的教训）：发布前的色彩保真守卫。
  # stage6 在发布前比对「原始输入 vs 本次编码暂存」的 RGB 三通道均值，
  # 最大绝对差超过阈值即记录。
  #
  # 起因：8-bit 输入的照片链曾长期产出**纯黑成品**而 rc=0 —— 契约、CICP、
  # avifdec 头部核验全部正常，只有像素是黑的。那次靠人工拿 avifdec 解出来
  # 算 mean 才发现。这个守卫让"整体崩坏"不可能再带着 rc=0 流出去。
  #
  # 阈值 60.0 的标定依据（shared_modules/color_probe.py 的 docstring）：
  #   纯黑成品 delta≈116 → 拦；ProPhoto→sRGB delta≈26.7 → 放行；
  #   普通 sRGB 正常处理 delta≈1 → 放行。
  # 即专门抓"整体崩坏"，不抓细微色偏。默认只 WARNING，阻断需 enforce。
  color_drift_threshold: 60.0
  color_drift_enforce: false
  # 宽色域（AdobeRGB / ProPhoto / DisplayP3）→ sRGB 的转换走 PIL ImageCms，
  # 而 Pillow 的 CMS **只支持 8-bit**（C-API 限制）。转换后的像素是
  # **正确的 sRGB**，但量化发生在 8-bit 网格上，母版会如实记
  # `precision_loss: true`（实测：普通 sRGB 路径母版 16-bit 无损，
  # 只有宽色域转换路径是 8-bit）。
  # 设为 true 则**拒绝**这种降级（rc=86），而不是交出 8-bit 精度的母版。
  # 默认 false：8-bit 量化误差约 0.4%，肉眼基本不可见，为此让整张照片
  # 失败不划算；有严苛归档需求时再打开。
  require_16bit_color_conversion: false
  avif_params:
    depth: 10
    yuv: "420"
    range: "limited"
    cicp: "1/13/1"
    cicp_rgb444: "1/13/0"
    speed: 4
    jobs: "all"
  avif_rgb444_params:
    lossless: true
    yuv: "444"
    depth: 16
    range: "limited"
    cicp: "1/13/0"
    speed: 4
    jobs: "all"
  scratch_remove: true
  scratch_remove_strength: 20
  deblock_strength: 25
  deband_threshold: 1.2
  grain_synthesis: true
  grain_strength: 0.3
  grain_size: 0.5    # FIX-R13-1: Changed from 1.0 to 0.5 per v7.32 §3.10.4 (Laplacian pyramid depth)
  grain_roughness: 0   # FIX-P12-12: Changed from 0.5 to 0 per v7.32 §3.10.4 (0=pure fine grain/film)
  gmic_windows_quote: "double"
  gmic_windows_disable_delayed_expansion: true
  gmic_windows_shell: false
  gmic_windows_whitelist: "[a-zA-Z0-9_\\-\\.\\/\\\\]"
  # FIX-2026-10-22：路径校验默认**不再**用上面那条白名单。
  #
  # 实测（G'MIC 4.0.5 + shell=False 的 argv 传递）：只有逗号 `,` 会破坏
  # G'MIC 的参数解析；括号 `()`、方括号 `[]`、`#` `&` `'` `+`、空格、中文
  # **全部正常**。而白名单 `[a-zA-Z0-9_\-./\\:]` 会把括号判成非法，于是
  # 真实照片里极其常见的 Windows 重名文件（`001(1).JPG`）让整批素材在
  # stage1 直接 rc=84：
  #   STAGE1_DEBAND_FAIL "G'MIC path contains forbidden characters"
  #
  # 现在默认走黑名单 + 路径分量首字符检查（见 stage1_preprocess.
  # _GMIC_FORBIDDEN_CHARS），只拒绝实证会坏的字符。
  # 有特殊合规要求时可把下面设为 true，恢复严格白名单（会拒掉括号/中文名）。
  gmic_strict_whitelist: false
  # v6.3 Stage 4 selective local processing
  local_mask_denoise: true
  local_mask_edge_threshold: 0.05
  local_mask_smooth_radius: 3
  # Archival mode: use RGB444 lossless instead of YUV420
  archival_mode: false

# 照片场景不使用 GrainFactory3（使用 G'MIC 颗粒合成），保留空占位以兼容统一配置系统
grain_factory3:
  enabled: false

# 照片场景不使用音频处理，保留空占位以兼容统一配置系统
audio:
  enabled: false

ai:
  enabled: false
  face_restore: "GFPGAN"
  # Supported upscale models per v7.32 §3.1:
  #   RealESRGAN_x2plus / RealESRGAN_x4plus — general-purpose (default)
  #   DAT_x2 / DAT_x4 — preferred for photo scans (PyTorch only)
  #   GPEN_x2 / GPEN_x4 — full-body portrait enhancement (v6.32 §4)
  # Fallback chain: on primary model failure, tries alternatives in priority order
  # (DAT -> RealESRGAN -> GPEN for photos)
  upscale_model: "realesr-general-x4v3"
  upscale_scale: 2
  model_dir: ""  # Empty = auto-detect PROJECT_ROOT/models; set explicit path if needed
  max_scale: 4
  lanczos_target: "auto"
  force_traditional_first: true
  force_allow_banned_upscale: false
  gpu_memory_fallback: true
  face_detect_fallback: ["RetinaFace", "YOLOv8-face", "MTCNN"]
  face_detect_threshold: 0.8
  face_detect_threshold_lowres: 0.6
  face_detect_lowres_max_dimension: 720
  ban_original_input_pixels: true
  ban_intermediate_pixels: true
